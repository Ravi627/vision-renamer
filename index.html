<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vision AI Tool</title>
  
  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" href="./icon.svg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VisionAI">
  <meta name="theme-color" content="#0f172a">
  
  <!-- CDN Libraries -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 sm:p-6">

  <div class="max-w-2xl w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 sm:p-8 shadow-2xl space-y-5">
    
    <!-- Header -->
    <div class="flex items-center justify-between">
      <div>
        <h1 class="text-2xl sm:text-3xl font-bold text-white flex items-center gap-2">
          ⚡ Vision AI Tool
        </h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-0.5">Instant single-photo OCR & batch ZIP renamer</p>
      </div>
    </div>

    <!-- API Key Input -->
    <div>
      <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Gemini API Key</label>
      <input type="password" id="apiKey" placeholder="AIzaSy..." 
             class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-sm focus:outline-none focus:border-indigo-500 text-white">
    </div>

    <!-- Prompt Presets & Input -->
    <div>
      <div class="flex justify-between items-center mb-1.5">
        <label class="block text-xs font-semibold uppercase text-slate-400">Prompt / Extraction Rule</label>
        <select id="presetSelect" onchange="applyPreset()" class="bg-slate-900 border border-slate-700 rounded-md text-xs px-2.5 py-1 text-indigo-400 focus:outline-none cursor-pointer">
          <option value="numbers">Preset: Numbers Only</option>
          <option value="ocr">Preset: Full Text OCR (Copy All)</option>
          <option value="words">Preset: Words & Names</option>
          <option value="serials">Preset: Serial / Barcodes</option>
          <option value="receipt">Preset: Receipt Total</option>
        </select>
      </div>
      <textarea id="promptInput" rows="2" 
                class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-xs sm:text-sm focus:outline-none focus:border-indigo-500 text-slate-200 resize-y"></textarea>
    </div>

    <!-- File Input -->
    <div>
      <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Select Photo(s) or ZIP</label>
      <input type="file" id="fileInput" multiple accept="image/*,.zip" 
             class="w-full text-sm text-slate-400 file:mr-3 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:bg-indigo-600 file:text-white file:font-semibold hover:file:bg-indigo-500 cursor-pointer">
      <p class="text-[11px] text-slate-500 mt-1">Pick 1 photo for instant extraction, or choose multiple / .ZIP for batch renaming</p>
    </div>

    <!-- Action Button -->
    <button id="startBtn" onclick="processFiles()" 
            class="w-full bg-indigo-600 hover:bg-indigo-500 font-semibold py-3.5 rounded-lg transition-all shadow-lg text-sm sm:text-base text-white flex items-center justify-center gap-2 cursor-pointer">
      <span>🚀 Extract Text</span>
    </button>

    <!-- Large Extracted Result Box -->
    <div id="instantResultBox" class="space-y-2 pt-3 border-t border-slate-700">
      <div class="flex justify-between items-center">
        <label class="text-xs font-semibold uppercase text-slate-400">Extracted Result</label>
        <div class="flex gap-2">
          <button id="clearBtn" onclick="clearResult()" class="text-xs bg-slate-900 hover:bg-slate-700 text-slate-400 font-medium px-2.5 py-1 rounded transition-colors">
            Clear
          </button>
          <button id="toggleExpandBtn" onclick="toggleExpand()" class="text-xs bg-slate-900 hover:bg-slate-700 text-indigo-300 font-medium px-2.5 py-1 rounded transition-colors">
            ⤢ Expand Box
          </button>
          <button id="copyBtn" onclick="copyResult()" class="text-xs bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-300 border border-indigo-500/40 font-medium px-3 py-1 rounded transition-colors flex items-center gap-1">
            📋 Copy Text
          </button>
        </div>
      </div>
      <textarea id="resultText" placeholder="Extracted text will appear here for instant copy/paste..." 
                class="w-full h-64 min-h-[160px] bg-slate-950 border border-slate-800 rounded-xl p-4 text-sm sm:text-base font-mono text-emerald-400 focus:outline-none focus:border-emerald-500/50 resize-y leading-relaxed transition-all"></textarea>
    </div>

    <!-- Batch Progress Log -->
    <div id="progressSection" class="hidden space-y-2 pt-2 border-t border-slate-700">
      <div class="flex justify-between text-xs font-semibold text-slate-300">
        <span id="statusText">Processing...</span>
        <span id="progressCount">0/0</span>
      </div>
      <div class="w-full bg-slate-900 rounded-full h-2 overflow-hidden border border-slate-700">
        <div id="progressBar" class="bg-indigo-500 h-full w-0 transition-all duration-300"></div>
      </div>
      <div id="logBox" class="bg-slate-950 border border-slate-800 rounded-lg p-3 h-36 overflow-y-auto font-mono text-xs text-slate-400 space-y-1"></div>
    </div>

  </div>

  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration skipped:', err));
      });
    }

    const presets = {
      numbers: "Extract ONLY the main numeric digits visible in this photo. Ignore timestamps and background noise. Return only digits, nothing else.",
      ocr: "Transcribe and extract ALL legible text visible in this photo exactly as written.",
      words: "Extract the primary title or header word(s) in this photo. Return concise text (1-4 words max).",
      serials: "Extract the serial number, SKU, or tracking code visible on the label. Return only the alphanumeric code.",
      receipt: "Find the total final amount on this receipt/invoice. Return just the monetary amount (e.g. 45.99)."
    };

    const promptInput = document.getElementById('promptInput');
    promptInput.value = presets.numbers;

    function applyPreset() {
      const selected = document.getElementById('presetSelect').value;
      if (presets[selected]) promptInput.value = presets[selected];
    }

    const apiKeyInput = document.getElementById('apiKey');
    apiKeyInput.value = localStorage.getItem('gemini_pwa_key') || '';
    apiKeyInput.addEventListener('input', (e) => localStorage.setItem('gemini_pwa_key', e.target.value.trim()));

    function copyResult() {
      const resultArea = document.getElementById('resultText');
      if (!resultArea.value) return;
      navigator.clipboard.writeText(resultArea.value);
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.textContent = '✅ Copied!';
      setTimeout(() => { copyBtn.textContent = '📋 Copy Text'; }, 1500);
    }

    function clearResult() {
      document.getElementById('resultText').value = '';
    }

    function toggleExpand() {
      const resultBox = document.getElementById('resultText');
      const btn = document.getElementById('toggleExpandBtn');
      if (resultBox.classList.contains('h-64')) {
        resultBox.classList.remove('h-64');
        resultBox.classList.add('h-[32rem]');
        btn.textContent = '⤡ Shrink Box';
      } else {
        resultBox.classList.remove('h-[32rem]');
        resultBox.classList.add('h-64');
        btn.textContent = '⤢ Expand Box';
      }
    }

    function log(msg) {
      const logBox = document.getElementById('logBox');
      const div = document.createElement('div');
      div.textContent = msg;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function sanitizeFilename(text) {
      return text.replace(/[\/\\:*?"<>|\n\r\t]/g, '').trim().substring(0, 80);
    }

    async function callGemini(base64Data, prompt, apiKey) {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3.1-flash-lite:generateContent?key=${apiKey}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [
              { inline_data: { mime_type: 'image/jpeg', data: base64Data } },
              { text: prompt }
            ]
          }]
        })
      });
      const data = await response.json();
      return data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
    }

    async function processFiles() {
      const apiKey = apiKeyInput.value.trim();
      const fileInput = document.getElementById('fileInput');
      const customPrompt = promptInput.value.trim();
      const resultBox = document.getElementById('resultText');
      const startBtn = document.getElementById('startBtn');

      if (!apiKey) return alert('Please enter your Gemini API Key!');
      if (!fileInput.files.length) return alert('Please choose at least one photo or ZIP file!');

      startBtn.disabled = true;
      startBtn.classList.add('opacity-50', 'cursor-not-allowed');
      resultBox.value = 'Analyzing image with Gemini...';

      const itemsToProcess = [];

      for (const file of fileInput.files) {
        if (file.name.toLowerCase().endsWith('.zip')) {
          const zip = await JSZip.loadAsync(file);
          for (const zipPath of Object.keys(zip.files)) {
            const entry = zip.files[zipPath];
            if (entry.isDirectory || zipPath.includes('__MACOSX/')) continue;
            const baseName = zipPath.split('/').pop();
            if (baseName.startsWith('.')) continue;
            if (/\.(png|jpe?g|webp)$/i.test(baseName)) {
              const blob = await entry.async('blob');
              itemsToProcess.push({ name: baseName, blob: blob });
            }
          }
        } else if (file.type.startsWith('image/')) {
          itemsToProcess.push({ name: file.name, blob: file });
        }
      }

      if (!itemsToProcess.length) {
        resultBox.value = '';
        startBtn.disabled = false;
        startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        return alert('No valid images detected!');
      }

      // Single photo
      if (itemsToProcess.length === 1) {
        try {
          const item = itemsToProcess[0];
          const base64 = await resizeImage(item.blob, 800);
          const extractedText = await callGemini(base64, customPrompt, apiKey);
          resultBox.value = extractedText || '[No readable text detected]';
        } catch (err) {
          resultBox.value = `Error: ${err.message}`;
        } finally {
          startBtn.disabled = false;
          startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
        }
        return;
      }

      // Batch mode
      const progressSection = document.getElementById('progressSection');
      progressSection.classList.remove('hidden');
      document.getElementById('logBox').innerHTML = '';

      const outputZip = new JSZip();
      const total = itemsToProcess.length;
      let processed = 0;
      let successCount = 0;
      let combinedResults = [];

      for (const item of itemsToProcess) {
        processed++;
        document.getElementById('progressBar').style.width = `${(processed / total) * 100}%`;
        document.getElementById('progressCount').textContent = `${processed}/${total}`;

        const ext = item.name.substring(item.name.lastIndexOf('.'));

        try {
          const base64 = await resizeImage(item.blob, 800);
          const text = await callGemini(base64, customPrompt, apiKey);
          const safeText = sanitizeFilename(text);

          if (safeText) {
            successCount++;
            combinedResults.push(`[${item.name}]\n${text}\n`);
            resultBox.value = combinedResults.join('\n');
            resultBox.scrollTop = resultBox.scrollHeight;

            let newName = `${safeText}${ext}`;
            let counter = 1;
            while (outputZip.files[newName]) {
              newName = `${safeText}_${counter}${ext}`;
              counter++;
            }
            outputZip.file(newName, item.blob);
            log(`✅ [${processed}/${total}] ${item.name} -> ${newName}`);
          } else {
            outputZip.file(`UNREADABLE_${item.name}`, item.blob);
            log(`⚠️ [${processed}/${total}] ${item.name} -> Unreadable`);
          }
        } catch (err) {
          outputZip.file(`UNREADABLE_${item.name}`, item.blob);
          log(`❌ [${processed}/${total}] Error on ${item.name}`);
        }

        await new Promise(r => setTimeout(r, 4100));
      }

      log(`\n🎉 Batch Complete! Packaging ZIP...`);
      const content = await outputZip.generateAsync({ type: 'blob' });
      saveAs(content, 'renamed_photos.zip');
      log('📦 Download ready!');

      startBtn.disabled = false;
      startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
    }

    function resizeImage(blob, maxDim) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => {
          let width = img.width;
          let height = img.height;
          if (width > maxDim || height > maxDim) {
            if (width > height) {
              height = Math.round((height * maxDim) / width);
              width = maxDim;
            } else {
              width = Math.round((width * maxDim) / height);
              height = maxDim;
            }
          }
          const canvas = document.createElement('canvas');
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', 0.85).split(',')[1]);
        };
        img.onerror = reject;
        img.src = URL.createObjectURL(blob);
      });
    }
  </script>
</body>
</html>
